<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Klido</title>

  <!-- Canonical URL -->
  <link rel="canonical" href="https://www.klido.in/" />

  <!-- Favicon Configuration (Google Search & Multi-Device Compliant) -->
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
  <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

  <!-- Meta Description -->
  <meta name="description"
    content="Klido is an independent digital marketing studio building measurable paid acquisition, technical SEO, conversion architecture, and clean attribution systems." />

  <!-- Open Graph / Facebook -->
  <meta property="og:site_name" content="Klido" />
  <meta property="og:title" content="Klido" />
  <meta property="og:description"
    content="Independent digital marketing studio building measurable paid acquisition, technical SEO, conversion architecture, and clean attribution systems." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://www.klido.in/" />
  <meta property="og:image" content="https://www.klido.in/klido_Logo.png" />

  <!-- Twitter Meta -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Klido" />
  <meta name="twitter:description"
    content="Independent digital marketing studio building measurable paid acquisition, technical SEO, conversion architecture, and clean attribution systems." />
  <meta name="twitter:image" content="https://www.klido.in/klido_Logo.png" />

  <!-- Structured Data: WebSite & Organization (Schema.org) for Google Brand Appearance -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "WebSite",
        "@id": "https://www.klido.in/#website",
        "url": "https://www.klido.in/",
        "name": "Klido",
        "alternateName": "Klido Agency",
        "description": "Independent digital marketing studio building measurable paid acquisition, technical SEO, conversion architecture, and clean attribution systems.",
        "publisher": {
          "@id": "https://www.klido.in/#organization"
        }
      },
      {
        "@type": "Organization",
        "@id": "https://www.klido.in/#organization",
        "name": "Klido",
        "url": "https://www.klido.in/",
        "logo": "https://www.klido.in/klido_Logo.png",
        "sameAs": [
          "https://www.instagram.com/klidoagency"
        ]
      }
    ]
  }
  </script>

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..600;1,9..40,400&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap"
    rel="stylesheet" />
</head>

<body class="bg-white text-[#0D1126] antialiased selection:bg-[#123FFF]/15 selection:text-[#0D1126]">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
